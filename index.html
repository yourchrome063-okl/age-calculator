
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>AgeWise - Age Calculator</title>
<meta name="description" content="Calculate your exact age in years, months and days with AgeWise.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080d1b;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: 50px auto;
    background: #111a2e;
    padding: 30px 22px;
    border-radius: 20px;
    border: 1px solid #263451;
    box-shadow: 0 10px 40px #0005;
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #38d9ff;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aab6cc;
    margin-bottom: 30px;
    line-height: 1.5;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 23px;
}

label {
    display: block;
    margin-bottom: 10px;
    color: #dce7ff;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #354666;
    background: #080f20;
    color: white;
    font-size: 16px;
    margin-bottom: 20px;
    color-scheme: dark;
}

.calculate-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #19c9ed, #7166ff);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.calculate-btn:active {
    transform: scale(.98);
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #8492aa;
    font-size: 13px;
    line-height: 1.6;
}

/* FULL SCREEN POPUP */
.popup-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, .82);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 99999;
}

.popup-overlay.show {
    display: flex;
}

.popup {
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    background: #111a2e;
    border: 1px solid #34466c;
    border-radius: 20px;
    padding: 25px 20px;
    position: relative;
    text-align: center;
    box-shadow: 0 15px 60px #0009;
    animation: popupIn .25s ease;
}

@keyframes popupIn {
    from {
        opacity: 0;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.close-btn {
    position: absolute;
    top: 12px;
    right: 15px;
    background: #263451;
    border: none;
    color: white;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
}

.popup h2 {
    color: #38d9ff;
    margin: 10px 0 22px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
}

.result-box {
    background: #1b2943;
    border: 1px solid #354766;
    border-radius: 12px;
    padding: 15px 5px;
}

.result-box strong {
    display: block;
    font-size: 28px;
    color: #38d9ff;
}

.result-box span {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #b6c3d9;
}

.extra-result {
    background: #1b2943;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
    color: #dce7ff;
    line-height: 1.7;
}

.extra-result strong {
    color: #38d9ff;
}

.close-main-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #19c9ed, #7166ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.error {
    color: #ff8585;
    font-size: 14px;
    margin-top: 12px;
    text-align: center;
}

@media(max-width: 380px) {
    .container {
        padding: 25px 17px;
    }

    .result-box strong {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">AgeWise</div>

    <p class="subtitle">
        Discover your exact age in years, months and days.
    </p>

    <h2>Age Calculator</h2>

    <label for="birthDate">Enter Your Date of Birth</label>

    <input type="date" id="birthDate">

    <button class="calculate-btn" onclick="calculateAge()">
        Calculate My Age
    </button>

    <p id="error" class="error"></p>

    <div class="footer">
        Your privacy matters. Your date of birth is not stored.
        <br>
        © 2026 AgeWise. All rights reserved.
    </div>
</div>

<!-- RESULT POPUP -->
<div class="popup-overlay" id="popupOverlay"
     onclick="outsideClose(event)">

    <div class="popup" role="dialog" aria-modal="true"
         aria-labelledby="resultTitle">

        <button class="close-btn" onclick="closePopup()"
                aria-label="Close">×</button>

        <h2 id="resultTitle">Your Age Result</h2>

        <div class="result-grid">
            <div class="result-box">
                <strong id="years">0</strong>
                <span>Years</span>
            </div>

            <div class="result-box">
                <strong id="months">0</strong>
                <span>Months</span>
            </div>

            <div class="result-box">
                <strong id="days">0</strong>
                <span>Days</span>
            </div>
        </div>

        <div class="extra-result">
            Total Days Lived:
            <strong id="totalDays">0</strong>
        </div>

        <div class="extra-result">
            Next Birthday:
            <strong id="nextBirthday">0 days</strong>
        </div>

        <button class="close-main-btn" onclick="closePopup()">
            Done
        </button>
    </div>
</div>

<script>
const birthInput = document.getElementById("birthDate");

function calculateAge() {
    const error = document.getElementById("error");
    error.textContent = "";

    if (!birthInput.value) {
        error.textContent = "Please enter your date of birth.";
        return;
    }

    const parts = birthInput.value.split("-").map(Number);

    const birth = new Date(
        parts[0], parts[1] - 1, parts[2]
    );

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (birth > today) {
        error.textContent = "Date of birth cannot be in the future.";
        return;
    }

    let years = today.getFullYear() - birth.getFullYear();
    let months = today.getMonth() - birth.getMonth();
    let days = today.getDate() - birth.getDate();

    if (days < 0) {
        months--;

        const previousMonthDays = new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        ).getDate();

        days += previousMonthDays;
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    const totalDays = Math.floor(
        (today - birth) / (1000 * 60 * 60 * 24)
    );

    let nextYear = today.getFullYear();

    let nextBirthday = new Date(
        nextYear,
        birth.getMonth(),
        birth.getDate()
    );

    if (nextBirthday <= today) {
        nextYear++;
        nextBirthday = new Date(
            nextYear,
            birth.getMonth(),
            birth.getDate()
        );
    }

    const daysUntilBirthday = Math.ceil(
        (nextBirthday - today) / (1000 * 60 * 60 * 24)
    );

    document.getElementById("years").textContent = years;
    document.getElementById("months").textContent = months;
    document.getElementById("days").textContent = days;

    document.getElementById("totalDays").textContent =
        totalDays.toLocaleString();

    document.getElementById("nextBirthday").textContent =
        daysUntilBirthday === 0
        ? "Today! Happy Birthday!"
        : daysUntilBirthday + " days";

    // Show popup in the CENTER of the phone screen
    document.getElementById("popupOverlay").classList.add("show");

    document.body.style.overflow = "hidden";
}

function closePopup() {
    document.getElementById("popupOverlay").classList.remove("show");
    document.body.style.overflow = "";
}

function outsideClose(event) {
    if (event.target.id === "popupOverlay") {
        closePopup();
    }
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closePopup();
    }
});
</script>

</body>
</html>
