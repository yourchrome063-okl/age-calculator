<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgeWise - Exact Age Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(18, 26, 43, 0.75);
            --border-glow: rgba(139, 92, 246, 0.25);
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            --btn-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 20% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(217, 70, 239, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--border-glow);
            border-radius: 28px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        .badge span { color: #8b5cf6; }

        h1 {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.8px;
            margin-bottom: 14px;
        }

        h1 .glow-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .input-group {
            background: rgba(10, 15, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 22px;
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 12px;
        }

        input[type="date"] {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #060911;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
            color-scheme: dark;
        }

        input[type="date"]:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .helper-text {
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
        }

        .calc-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: var(--primary-grad);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.4);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .calc-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.5);
        }

        /* Result Section Inside the Main Card (No Scrolling Needed) */
        .result-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease-in;
            opacity: 0;
        }

        .result-container.show {
            max-height: 300px;
            opacity: 1;
            margin-top: 24px;
        }

        .result-box-inner {
            background: rgba(10, 15, 26, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .success-tag {
            color: #34d399;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .res-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 6px;
        }

        .res-card .num {
            display: block;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .res-card .label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-top: 2px;
            display: block;
        }

        .extra-box {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="badge"><span>✦</span> Free Online Tool</div>
        <h1>Discover your <span class="glow-text">exact age</span></h1>
        <p class="description">Every year, month and day matters. Enter your date of birth and find out exactly how long you have been on this planet.</p>

        <div class="input-group">
            <label for="dob">Your date of birth</label>
            <input type="date" id="dob">
            <div class="helper-text">Choose your birthday to calculate your age instantly.</div>
        </div>

        <button class="calc-btn" onclick="calculateAge()">
            Calculate my age <span>→</span>
        </button>

        <!-- Result Section inside the Card -->
        <div class="result-container" id="resultContainer">
            <div class="result-box-inner">
                <div class="success-tag">✦ Calculation Complete</div>
                <div class="results-grid">
                    <div class="res-card">
                        <span class="num" id="years">0</span>
                        <span class="label">Years</span>
                    </div>
                    <div class="res-card">
                        <span class="num" id="months">0</span>
                        <span class="label">Months</span>
                    </div>
                    <div class="res-card">
                        <span class="num" id="days">0</span>
                        <span class="label">Days</span>
                    </div>
                </div>
                <div class="extra-box" id="extraBox"></div>
            </div>
        </div>
    </div>

    <script>
        function calculateAge() {
            const dobVal = document.getElementById('dob').value;
            if (!dobVal) {
                alert("Please select your date of birth!");
                return;
            }

            const dob = new Date(dobVal);
            const today = new Date();

            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;

            const diffTime = Math.abs(today - dob);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);

            document.getElementById('extraBox').innerHTML = `✨ You have lived approximately <b>${diffDays.toLocaleString()}</b> days (or <b>${diffWeeks.toLocaleString()}</b> weeks)!`;

            // Smoothly slide down and show result inside the card
            document.getElementById('resultContainer').classList.add('show');
        }
    </script>

</body>
</html>
